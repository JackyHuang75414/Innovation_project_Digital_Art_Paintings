spring:
  application:
    name: backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.18.32.1:3306/digital_art_paintings
    username: root
    password: 123456

server:
  port: 8000
  servlet:
    context-path: /api

mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.ren.yinghui.backend.entity
    configuration:
      map-underscore-to-camel-case: true

ai:
  deepseek:
    chat-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
